# https://taskfile.dev
version: "3"

tasks:
  list:
    internal: true
    silent: true
    cmd: task --list-all 2>&1 | grep "frontend:"

  setup:
    desc: Install JS deps and build
    cmds:
      - pnpm install
      - task: frontend:build

  dev:
    desc: Vite dev server
    cmd: pnpm --filter @platform/app exec vite

  build:
    desc: Production build (type-check then bundle)
    cmds:
      - pnpm --filter @platform/app exec vue-tsc -b
      - pnpm --filter @platform/app exec vite build

  test:
    desc: Run Vitest once
    cmd: pnpm --filter @platform/app exec vitest run

  test:watch:
    desc: Run Vitest in watch mode
    cmd: pnpm --filter @platform/app exec vitest

  lint:
    desc: Lint all packages with oxlint
    cmds:
      - pnpm --filter @platform/ds exec oxlint .
      - pnpm --filter @platform/app exec oxlint .

  format:
    desc: Format with oxfmt (write in place)
    cmd: pnpm exec oxfmt --write .

  format:check:
    desc: Check formatting without writing (CI)
    cmd: pnpm exec oxfmt --check .

  type-check:
    desc: TypeScript type-check (vue-tsc, both packages)
    cmd: pnpm --filter @platform/app exec vue-tsc --noEmit

  update:
    desc: Update all pnpm dependencies
    cmd: pnpm update --recursive

  pn:
    desc: Run pnpm commands (task frontend:pn -- add lodash)
    cmd: pnpm {{.CLI_ARGS}}

  add:
    desc: pnpm add to app package (task frontend:add -- lodash)
    cmd: pnpm --filter @platform/app add -- {{.CLI_ARGS}}

  ds:add:
    desc: pnpm add to ds package (task frontend:ds:add -- some-lib)
    cmd: pnpm --filter @platform/ds add -- {{.CLI_ARGS}}

  remove:
    desc: pnpm remove from app package (task frontend:remove -- lodash)
    cmd: pnpm --filter @platform/app remove -- {{.CLI_ARGS}}
