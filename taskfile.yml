# https://taskfile.dev

version: "3"
output: group
color: true

includes:
  frontend:
    taskfile: .tasks/frontend.yml
    dir: ./frontend
  backend:
    taskfile: .tasks/backend.yml
    dir: ./backend
  make:
    taskfile: .tasks/make.yml
    dir: ./backend

tasks:
  default:
    silent: true
    cmd: task --list-all

  # -----------------------------------------------------------------------
  # Setup
  # -----------------------------------------------------------------------

  setup:
    desc: Full project setup (backend + frontend + Herd)
    deps: [backend:setup, frontend:setup, setup:herd]

  setup:herd:
    desc: Link and secure site in Laravel Herd
    cmds:
      - herd link your-app
      - herd secure your-app

  # -----------------------------------------------------------------------
  # Development
  # -----------------------------------------------------------------------

  dev:
    desc: Start Vite dev server
    deps: [frontend:dev]

  dev:stripe:
    desc: Forward Stripe webhooks to local
    cmd: stripe listen --forward-to https://your-app.test/stripe/webhook

  # -----------------------------------------------------------------------
  # Build
  # -----------------------------------------------------------------------

  build:
    desc: Generate routes then build frontend
    cmds:
      - task: backend:build:routes
      - task: frontend:build

  test:
    desc: Run all tests — backend (Pest) + frontend (Vitest) in parallel
    deps: [backend:test, frontend:test]

  commit:
    desc: Run all checks before committing — stops on first failure
    cmds:
      - task: backend:test
      - task: backend:lint
      - task: backend:format
      - task: frontend:test
      - task: frontend:format:check
      - task: frontend:lint
      - task: frontend:build
